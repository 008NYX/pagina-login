<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="cadastro.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <main>
        <div class="imagem">
        </div>
        <div class="login">
            <h1>Faça seu cadastro</h1>
            <p>Bem-vindo para fazer seu cadastro preencha as informações abaixo!</p>
            <div class="content">
                <div class="inputs">
                    <input type="text" placeholder="Nome de usuário:" class="user" id="cadastroName">
                    <input type="email" placeholder="Email:" class="user" id="cadastroMail">
                    <input type="password" placeholder="Senha:" class="psswrd" id="cadastroSenha">
                    <input type="password" placeholder="Confirme sua senha:" class="psswrd" id="cadastroConfirm">
                </div>

                <button type="button" class="entrar" id="cadastroButton">Cadastrar</button>
                <div class="cadastro">
                    <p>Já tem uma conta? <a href="index.html" class="cadastrobtn">Faça login já!</a></p>
                </div>
            </div>
        </div>

    </main>

    <script src="cadastro.js"></script>
</body>

</html>
