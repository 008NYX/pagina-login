<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<body>
    <main>
        <div class="imagem">
        </div>
        <div class="login">
            <h1>Faça seu login</h1>
            <p>Bem-vindo novamente, por favor, preencha as informações abaixo!</p>
            <div class="content">
                <div class="inputs">
                    <input type="text" placeholder="Nome de usuário:" class="user">
                    <input type="password" placeholder="Digite sua senha:" class="psswrd">
                </div>

                <a href="#" class="entrar">Entrar</a>
                <div class="cadastro">
                    <p>Não tem uma conta? <a href="cadastro.html" class="cadastrobtn">Cadastre-se já!</a></p>
                </div>
            </div>
        </div>

    </main>
</body>

</html>
