<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Portfólio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Asap+Sharp:ital,wght@0,100..900;1,100..900&family=Changa+One:ital@0;1&family=Lexend:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
        }

        .imagem {
            height: 100vh;
            background-image: url(img/fundolegal.png);
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        .login {
            font-family: "Poppins";
            text-align: center;
            display: flex;
            flex-direction: column;
            background-color: #181B26;
            justify-content: center;
            align-items: center;
            padding: 0 40px;
        }

        .login h1 {
            font-size: 2.5rem;
            color: #E0B787;
            margin-bottom: 10px;
        }

        .login p {
            color: #ffd4a3;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .entrar {
            text-decoration: none;
            color: #E0B787;
            font-size: 1.2rem;
            font-weight: bold;
            background-color: #141924;
            padding: 15px 40px;
            border: solid 1px rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: inline-block;
            transition: transform 0.1s ease-in-out, background-color 0.2s;
            margin-bottom: 20px;
        }

        .entrar:hover {
            transform: scale(1.03);
            background-color: #1f2533;
        }

        a {
            text-decoration: none;
        }

        .cadastrobtn {
            color: #E5AF73;
            font-size: 0.9rem;
        }

        .cadastrobtn:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <main>
        <div class="imagem"></div>
        <div class="login">
            <h1>Login realizado!</h1>
            <p>Seja bem-vindo ao painel de teste do seu sistema de autenticação.</p>
            
            <a href="https://nyx-portfolio-mu.vercel.app/" target="_blank" class="entrar">Ver meu Portfólio</a>
            
            <div>
                <a href="index.html" class="cadastrobtn">Sair / Voltar ao login</a>
            </div>
        </div>
    </main>
</body>

</html>
